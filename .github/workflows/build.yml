name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26 if available
        run: |
          ls /Applications/ | grep -i xcode || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project KokoroSpike.xcodeproj \
            -scheme KokoroSpike \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache"

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project KokoroSpike.xcodeproj \
            -scheme KokoroSpike \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KokoroSpike.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP=$(ls -d "$RUNNER_TEMP/KokoroSpike.xcarchive/Products/Applications/"*.app | head -1)
          echo "App: $APP"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry KokoroSpike-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KokoroSpike-unsigned-ipa
          path: ${{ runner.temp }}/KokoroSpike-unsigned.ipa
